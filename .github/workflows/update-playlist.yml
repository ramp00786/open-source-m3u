name: Update playlist

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: write

jobs:
  check-and-filter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: pip install requests

      - name: Check stream links and rebuild final_m3u.m3u
        run: python3 scripts/check_and_filter.py

      - name: Build EPG channel mapping
        run: python3 scripts/build_epg_channels.py

      - name: Checkout iptv-org/epg grabber
        uses: actions/checkout@v4
        with:
          repository: iptv-org/epg
          ref: master
          path: epg-tool

      - name: Install EPG grabber dependencies
        working-directory: epg-tool
        run: npm install

      - name: Grab EPG
        working-directory: epg-tool
        continue-on-error: true
        run: npm run grab --- --channels=../scripts/epg_channels.xml --output=../epg.xml --maxConnections=10

      - name: Add EPG header to final_m3u.m3u
        run: python3 scripts/add_epg_header.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add final_m3u.m3u scripts/epg_channels.xml
          if [ -f epg.xml ]; then git add epg.xml; fi
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-update final_m3u.m3u and epg.xml"
            git push
          fi
